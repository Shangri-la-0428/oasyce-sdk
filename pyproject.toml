[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oasyce-sdk"
version = "0.3.0"
description = "Python SDK for Oasyce -- Agent-Native Settlement Infrastructure"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Oasyce", email = "dev@oasyce.com"}]
keywords = ["oasyce", "blockchain", "ai-agents", "cosmos-sdk", "settlement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://oasyce.com"
Documentation = "https://oasyce.com/docs.html"
Repository = "https://github.com/Shangri-la-0428/oasyce-sdk"
Issues = "https://github.com/Shangri-la-0428/oasyce-sdk/issues"
Chain = "https://github.com/Shangri-la-0428/oasyce-chain"

[tool.hatch.build.targets.wheel]
packages = ["oasyce_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
