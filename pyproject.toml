[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oasyce-sdk"
version = "0.10.5"
description = "Python SDK for Oasyce -- On-chain economic system for AI agents: escrow, service marketplace, data rights, reputation, dispute resolution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Oasyce", email = "dev@oasyce.com"}]
keywords = [
    "oasyce", "blockchain", "ai-agents", "cosmos-sdk", "settlement",
    "escrow", "mcp", "llm", "agent-economy", "data-rights",
    "reputation", "service-marketplace", "proof-of-work",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "requests>=2.28",
    "coincurve>=18.0; platform_machine != 'wasm32'",
    "ecdsa>=0.18",
    "mnemonic>=0.20",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
langchain = ["langchain-core>=0.2"]
all = ["mcp>=1.0", "langchain-core>=0.2"]

[project.scripts]
oasyce = "oasyce_sdk.cli:main"
oasyce-mcp = "oasyce_sdk.mcp_server:main"
oasyce-agent = "oasyce_sdk.agent.cli:main"

[project.urls]
Homepage = "https://github.com/Shangri-la-0428/oasyce-chain"
Documentation = "http://47.93.32.88:1317/llms.txt"
Repository = "https://github.com/Shangri-la-0428/oasyce-sdk"
Issues = "https://github.com/Shangri-la-0428/oasyce-sdk/issues"
Chain = "https://github.com/Shangri-la-0428/oasyce-chain"
MCP = "https://github.com/Shangri-la-0428/oasyce-sdk#mcp-server"

[tool.hatch.build.targets.wheel]
packages = ["oasyce_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
